[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marmara-resilience-engine"
version = "0.1.0.dev0"
description = "MRE-001: synthetic-city vertical-slice prototype for earthquake resilience simulation"
readme = "README.md"
requires-python = "==3.12.*"

# INTENTIONALLY EMPTY.
#
# The scientific runtime stack (numpy, scipy, pandas, shapely, pyproj,
# geopandas, networkx, osgeo/GDAL) is supplied by the QGIS 3.44.12 bundled
# Python 3.12 via `.venv` created with --system-site-packages.
#
# `osgeo` has no installable Windows wheel, and this project must not install a
# second standalone GDAL. Listing these here would invite pip to resolve and
# rebuild them, which would break the environment. See docs/ARCHITECTURE.md.
dependencies = []

[project.optional-dependencies]
# Dev-only tooling; safe to install into .venv because it pulls no geo stack.
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["mre*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "blender: requires the Blender executable; skipped when unavailable",
    "slow: long-running simulation test",
]
filterwarnings = ["ignore::DeprecationWarning"]
